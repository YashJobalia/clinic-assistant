<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#183c30" />
    <title>You're offline | Clinic Assistant</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f8f5;
        color: #203c35;
        font:
          16px/1.6 Arial,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 80px;
        height: 80px;
        border-radius: 22px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin-top: 28px;
      }
      p {
        color: #61766b;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 24px;
        border-radius: 12px;
        background: #183c30;
        color: #fff;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #7cb69a;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 28px;
        color: #61766b;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Clinic Assistant" />
      <h1>Let's reconnect.</h1>
      <p>
        Clinic Assistant needs an internet connection for voice conversations, sign-in
        and appointments. Reconnect, then return to your workspace.
      </p>
      <a href="/">Try again</a>
      <small
        >Your saved conversations will be available when you're back
        online.</small
      >
    </main>
  </body>
</html>
